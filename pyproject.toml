[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday-pattern-research"
version = "0.1.0"
description = "K-Shape clustering and hybrid GRU classification of intraday futures patterns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "tslearn>=0.6,<0.11", "torch>=2.1,<3", "matplotlib>=3.7,<4", "pyarrow>=12"]

[project.scripts]
intraday-patterns = "intraday_patterns.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
